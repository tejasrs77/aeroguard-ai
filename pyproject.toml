[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroguard-ai"
version = "0.1.0"
description = "Predictive maintenance and grounded reliability copilot for NASA turbofan data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "mlflow>=2.17,<4",
  "numpy>=1.26,<3",
  "openai>=2,<3",
  "pandas>=2.2,<3",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "shap>=0.46,<1",
  "torch>=2.5,<3",
  "uvicorn>=0.30,<1",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
aeroguard = "aeroguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeroguard = ["api/static/*"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
